<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffab00"/>
      <stop offset="100%" style="stop-color:#ff8f00"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#f0a000"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg4)" rx="16"/>
  <!-- Trophy cup -->
  <path d="M170,55 L230,55 L225,100 Q220,120 200,125 Q180,120 175,100 Z" fill="url(#gold)" opacity="0.9"/>
  <rect x="185" y="125" width="30" height="12" rx="2" fill="#ffab00"/>
  <rect x="175" y="137" width="50" height="8" rx="4" fill="#ff8f00"/>
  <!-- Cup handles -->
  <path d="M170,60 Q145,60 145,80 Q145,95 165,95" fill="none" stroke="#ffd700" stroke-width="3" opacity="0.7"/>
  <path d="M230,60 Q255,60 255,80 Q255,95 235,95" fill="none" stroke="#ffd700" stroke-width="3" opacity="0.7"/>
  <!-- Star on trophy -->
  <polygon points="200,70 205,82 218,82 208,90 212,103 200,95 188,103 192,90 182,82 195,82" fill="#fff" opacity="0.5"/>
  <!-- #1 text -->
  <text x="200" y="120" text-anchor="middle" fill="#1a1a3e" font-family="Arial,sans-serif" font-size="18" font-weight="bold">#1</text>
  <!-- Sparkles -->
  <text x="130" y="50" fill="#ffd700" font-family="Arial,sans-serif" font-size="16" opacity="0.6">✦</text>
  <text x="265" y="45" fill="#ffd700" font-family="Arial,sans-serif" font-size="20" opacity="0.5">✦</text>
  <text x="150" y="130" fill="#ffd700" font-family="Arial,sans-serif" font-size="12" opacity="0.4">✦</text>
  <text x="255" y="125" fill="#ffd700" font-family="Arial,sans-serif" font-size="14" opacity="0.45">✦</text>
  <!-- Title -->
  <text x="200" y="180" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="bold">NAPI TOP</text>
  <text x="200" y="208" text-anchor="middle" fill="#ffd700" font-family="Arial,sans-serif" font-size="16" font-weight="bold">JUTALOM 🏆</text>
  <!-- Decorative -->
  <circle cx="50" cy="200" r="16" fill="#ffd700" opacity="0.12"/>
  <circle cx="350" cy="60" r="12" fill="#ffab00" opacity="0.15"/>
</svg>
