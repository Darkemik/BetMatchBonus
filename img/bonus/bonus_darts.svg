<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#2d1b4e"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6f00"/>
      <stop offset="100%" style="stop-color:#ffab00"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg2)" rx="16"/>
  <!-- Dartboard -->
  <circle cx="200" cy="100" r="65" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="200" cy="100" r="65" fill="#1a3c34" opacity="0.5"/>
  <circle cx="200" cy="100" r="50" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <circle cx="200" cy="100" r="35" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="200" cy="100" r="35" fill="#2d1b1b" opacity="0.4"/>
  <circle cx="200" cy="100" r="20" fill="none" stroke="#e94560" stroke-width="2"/>
  <circle cx="200" cy="100" r="8" fill="#e94560"/>
  <circle cx="200" cy="100" r="3" fill="#fff"/>
  <!-- Dart arrow -->
  <line x1="280" y1="40" x2="208" y2="95" stroke="url(#accent2)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="208,95 215,85 218,98" fill="#ff6f00"/>
  <line x1="280" y1="40" x2="295" y2="28" stroke="#aaa" stroke-width="1.5"/>
  <line x1="280" y1="40" x2="292" y2="45" stroke="#aaa" stroke-width="1.5"/>
  <!-- Crosshairs -->
  <line x1="200" y1="30" x2="200" y2="170" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="130" y1="100" x2="270" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Title -->
  <text x="200" y="195" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="bold">DARTS</text>
  <text x="200" y="220" text-anchor="middle" fill="#ffab00" font-family="Arial,sans-serif" font-size="16" font-weight="bold">BÓNUSZ 🎯</text>
  <!-- Decorative -->
  <circle cx="55" cy="55" r="14" fill="#ff6f00" opacity="0.2"/>
  <circle cx="345" cy="195" r="18" fill="#ffab00" opacity="0.2"/>
</svg>
