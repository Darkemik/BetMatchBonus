<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#f06292"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg1)" rx="16"/>
  <!-- Calendar icon -->
  <rect x="140" y="40" width="120" height="110" rx="12" fill="none" stroke="url(#accent1)" stroke-width="3"/>
  <rect x="140" y="40" width="120" height="30" rx="12" fill="url(#accent1)"/>
  <rect x="140" y="58" width="120" height="12" fill="url(#accent1)"/>
  <circle cx="165" cy="52" r="4" fill="#fff"/>
  <circle cx="235" cy="52" r="4" fill="#fff"/>
  <!-- Weekday letters -->
  <text x="158" y="90" fill="#4fc3f7" font-family="Arial,sans-serif" font-size="11" font-weight="bold">H</text>
  <text x="177" y="90" fill="#4fc3f7" font-family="Arial,sans-serif" font-size="11" font-weight="bold">K</text>
  <text x="196" y="90" fill="#4fc3f7" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Sz</text>
  <text x="216" y="90" fill="#4fc3f7" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Cs</text>
  <text x="237" y="90" fill="#4fc3f7" font-family="Arial,sans-serif" font-size="11" font-weight="bold">P</text>
  <!-- Checkmarks -->
  <text x="160" y="115" fill="#4caf50" font-family="Arial,sans-serif" font-size="16">✓</text>
  <text x="179" y="115" fill="#4caf50" font-family="Arial,sans-serif" font-size="16">✓</text>
  <text x="198" y="115" fill="#4caf50" font-family="Arial,sans-serif" font-size="16">✓</text>
  <text x="218" y="115" fill="#4caf50" font-family="Arial,sans-serif" font-size="16">✓</text>
  <text x="238" y="115" fill="#4caf50" font-family="Arial,sans-serif" font-size="16">✓</text>
  <!-- 100% badge -->
  <rect x="155" y="125" width="90" height="22" rx="11" fill="url(#accent1)"/>
  <text x="200" y="141" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="bold">100%</text>
  <!-- Title -->
  <text x="200" y="185" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="bold">HÉTKÖZNAPI</text>
  <text x="200" y="210" text-anchor="middle" fill="#4fc3f7" font-family="Arial,sans-serif" font-size="16" font-weight="bold">BÓNUSZ</text>
  <!-- Decorative coins -->
  <circle cx="60" cy="60" r="18" fill="#f0c040" opacity="0.3"/>
  <circle cx="340" cy="180" r="22" fill="#f0c040" opacity="0.25"/>
  <circle cx="50" cy="190" r="12" fill="#4caf50" opacity="0.2"/>
</svg>
